# Netlify production config for the Saks corporate site.
# Static site: the catalog build regenerates product data from catalog/products/*.yaml.
[build]
  publish = "site"
  command = "npm ci && npm run build:catalog"

[build.environment]
  NODE_VERSION = "20"

# Serve the custom 404 page for unknown paths.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

# Security headers matching the live www.saks.industries deploy.
# CSP script-src hash covers the inline hero-grow opt-in script in index.html.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'sha256-MBwNMDXRk59VAh7dWxGchD9lf3Car1vq1Vvi1cLN8nE='; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-src https://www.google.com; object-src 'none'; base-uri 'self'; form-action 'self' mailto:; frame-ancestors 'none'; upgrade-insecure-requests"
    Strict-Transport-Security = "max-age=31536000"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Cross-Origin-Opener-Policy = "same-origin"
