    <path d="M214 196a106 106 0 0 1 212 0" stroke="#1d4ed8" stroke-width="8" stroke-opacity=".7"/>
    <path d="M178 196a142 142 0 0 1 284 0" stroke="#06b6d4" stroke-width="6" stroke-opacity=".85"/>
  </g>
  <circle cx="320" cy="196" r="10" fill="#06b6d4"/>
  <circle cx="320" cy="196" r="22" fill="none" stroke="#ffffff" stroke-opacity=".35" stroke-width="2"/>
</svg>
