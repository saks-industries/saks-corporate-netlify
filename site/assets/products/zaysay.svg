<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="ZaySay">
  <defs>
    <linearGradient id="zaysay-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2a3d"/>
      <stop offset="1" stop-color="#0d1b2a"/>
    </linearGradient>
    <pattern id="zaysay-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity=".07" stroke-width="1"/>
    </pattern>
    <radialGradient id="zaysay-glow" cx="50%" cy="46%" r="40%">
      <stop offset="0" stop-color="#06b6d4" stop-opacity=".35"/>
      <stop offset="1" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="640" height="360" fill="url(#zaysay-bg)"/>
  <rect width="640" height="360" fill="url(#zaysay-grid)"/>
  <rect width="640" height="360" fill="url(#zaysay-glow)"/>
  <g fill="none" stroke-linecap="round">
