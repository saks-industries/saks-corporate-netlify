name: Deploy site to GitHub Pages

# Durable production hosting for the corporate site (SAK-33 / Phase 3).
# No NETLIFY_AUTH_TOKEN is available to this repo, so GitHub Pages is the
# production host (per Phase 3 deliverable #1 fallback). Publishes the static
# site in ./site whenever the phase2-site branch changes.
# Custom-domain cutover (a CNAME file + board DNS) is a pending board action;
# add site/CNAME once the board provides the domain.
on:
  push:
    branches: [phase2-site]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; newer pushes cancel older in-flight ones.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./site
      - id: deployment
        uses: actions/deploy-pages@v4
