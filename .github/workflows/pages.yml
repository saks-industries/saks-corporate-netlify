name: Deploy Phase 2 site preview to GitHub Pages

# Non-production board-review preview for SAK-27. Publishes the static site in
# ./site to GitHub Pages whenever the phase2-site branch changes. Production
# cutover (custom domain / Netlify) is Phase 3 and is intentionally not here.
on:
  push:
    branches: [phase2-site]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; newer pushes cancel older in-flight ones.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./site
      - id: deployment
        uses: actions/deploy-pages@v4
